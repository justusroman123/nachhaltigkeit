<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Live-Übersetzung</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/listener.css">
</head>
<body>
<header>
  <span id="lang">…</span>
  <span id="status" class="muted" role="status"></span>
  <button id="btnLang" aria-label="Sprache ändern" title="Sprache ändern">🌐</button>
  <button id="btnSound" aria-label="Ton ein/aus" title="Ton ein/aus" aria-pressed="false">🔇</button>
  <input id="vol" type="range" min="0" max="1" step="0.1" value="1" aria-label="Lautstärke">
  <button id="btnSmaller" aria-label="Schrift kleiner">A−</button>
  <button id="btnBigger" aria-label="Schrift größer">A+</button>
</header>
<main id="subs" aria-live="polite"></main>
<section id="talkDock" hidden>
  <div id="turnBand" role="status" aria-live="polite"></div>
  <div id="sentBar" class="sentbar" hidden><div></div></div>
  <button id="btnTalk" class="big"></button>
  <p id="talkNote" class="muted"></p>
</section>
<footer id="notice"><span id="histNote"></span> · <span id="aiText"></span> <a id="privacyLink" href="datenschutz.html" target="_blank" rel="noopener"></a></footer>
<div id="picker" role="dialog" aria-modal="true" aria-label="Sprache wählen / Choose language" hidden>
  <div class="globe" aria-hidden="true">🌐</div>
  <p id="pickerInfo" class="muted" dir="auto"></p>
</div>
<div id="startScreen" role="dialog" aria-modal="true" aria-labelledby="startAi" hidden>
  <button id="btnStartSound" class="big"></button>
  <button id="btnSubsOnly"></button>
  <p id="startAi"></p>
  <p id="startPrivacy"></p>
  <p><a id="startPrivacyLink" href="datenschutz.html" target="_blank" rel="noopener"></a></p>
</div>
<script src="js/strings.js"></script>
<script src="js/listener.js"></script>
</body>
</html>
