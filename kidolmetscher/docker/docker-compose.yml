# Start (Mock, ohne GPU, nur lokal):  docker compose -f docker/docker-compose.yml --profile mock up --build
# Start (GPU-Server mit HTTPS):       docker compose -f docker/docker-compose.yml --profile gpu up --build
# Voraussetzungen: .env im Projektstamm (aus .env.example kopieren, OPERATOR_KEY setzen), BASE_IMAGE gesetzt,
# fuer das Profil gpu zusaetzlich DOMAIN (zeigt auf den Server; Standard example.invalid ist ein Platzhalter) und MODELS_DIR.
# NICHT gebaut/getestet in dieser Umgebung (nur Syntaxpruefung mit "docker compose config").
x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile.gpu
    args:
      BASE_IMAGE: ${BASE_IMAGE:?BASE_IMAGE setzen (gepruefter CUDA- oder Python-Basis-Tag)}
  env_file: ../.env
  # Im Container gelten feste Werte (ueberschreiben HOST/WEB_DIR aus der .env fuer lokalen Start).
  environment: &container_env
    HOST: 0.0.0.0
    WEB_DIR: /app/web
  read_only: true              # nichts wird gespeichert
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "1m", max-file: "2" }

services:
  mock:
    <<: *common
    profiles: ["mock"]
    ports: ["127.0.0.1:8000:8000"]       # nur lokal erreichbar

  # Dienst "pipeline" aus dem Plan (Prompt B), hier "gpu" genannt: Port nur im internen Netz, davor Caddy mit TLS.
  gpu:
    <<: *common
    profiles: ["gpu"]
    environment:
      <<: *container_env
      ASR_BACKEND: real
      MT_BACKEND: real
      TTS_BACKEND: real
      # Keine Verbindungen der Modell-Bibliotheken ins Internet zur Laufzeit (Modelle liegen unter /models):
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      PUBLIC_URL: https://${DOMAIN:-example.invalid}
    expose: ["8000"]
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro   # Modelle nur lesend, nicht im Image, nicht im Repo
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  caddy:
    image: caddy:2                        # Tag vor Einsatz pruefen
    profiles: ["gpu"]
    environment:
      DOMAIN: ${DOMAIN:-example.invalid}
    ports: ["80:80", "443:443"]           # einzige von aussen erreichbare Ports (neben SSH auf dem Host)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                  # Zertifikate (keine Nutzerdaten)
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on: [gpu]

volumes:
  caddy_data:
